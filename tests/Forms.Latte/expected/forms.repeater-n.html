<form action="" method="post" id="frm-orderForm">
<table>
	<tbody data-nette-repeater="items" data-nette-repeater-min="1" data-nette-repeater-max="5">
		<tr data-repeater-index="0" class=row>
			<td><input type="text" name="items[0][description]" id="frm-orderForm-items-0-description" list="frm-orderForm-items-0-description-list"></td>
			<td><input type="number" name="items[0][quantity]" id="frm-orderForm-items-0-quantity" data-nette-rules='[{"op":":integer","msg":"Please enter a valid integer."}]'></td>
			<td><button type="button" data-nette-repeater-remove="true">Remove</button></td>
		<input type="hidden" name="items[0][id]" value=""></tr>
<template>
		<tr data-repeater-index="__index0__" class=row>
			<td><input type="text" name="items[__index0__][description]" id="frm-orderForm-items-__index0__-description" list="frm-orderForm-items-__index0__-description-list"></td>
			<td><input type="number" name="items[__index0__][quantity]" id="frm-orderForm-items-__index0__-quantity" data-nette-rules='[{"op":":integer","msg":"Please enter a valid integer."}]'></td>
			<td><button type="button" data-nette-repeater-remove="true">Remove</button></td>
		<input type="hidden" name="items[__index0__][id]" value=""><datalist id="frm-orderForm-items-__index0__-description-list"><option value="Apple"></option></datalist></tr>
</template>
	</tbody>
</table>
<button type="button" data-nette-repeater-add="items">Add row</button>

<div data-nette-repeater="tags" data-nette-repeater-min="0" class=tags><div data-repeater-index="0">
	<input type="text" name="tags[0][name]" id="frm-orderForm-tags-0-name">
	<button type="button" data-nette-repeater-remove="true">x</button>
</div>
<template>
<div data-repeater-index="__index0__">
	<input type="text" name="tags[__index0__][name]" id="frm-orderForm-tags-__index0__-name">
	<button type="button" data-nette-repeater-remove="true">x</button>
</div>
</template>
</div>
<button type="button" data-nette-repeater-add="tags">Add tag</button>

<input type="submit" name="send" value="Send">
<datalist id="frm-orderForm-items-0-description-list"><option value="Apple"></option></datalist><input type="hidden" name="_form_" value="orderForm"></form>
